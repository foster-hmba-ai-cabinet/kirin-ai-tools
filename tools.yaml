# =============================================================================
# KIRIN AI Tools Repository — canonical catalog (single source of truth)
# -----------------------------------------------------------------------------
# This file is the ONE place tools live. index.html (the website) and README.md
# tables are GENERATED from it by scripts/build.py. Edit here, then run it.
# Do not hand-edit the generated files.
#
# This file is also exported to tools.json on build for KIRIN ingestion and the
# monthly n8n digest (see docs/monthly-digest.md).
#
# cost_tier  values: Free | Freemium | Paid | Free for students | Institutional
# difficulty values: Beginner | Intermediate | Advanced
# contexts   values: any of [education, professional, personal] (several allowed)
# added:     ISO date the tool entered the catalog (YYYY-MM-DD). Powers the NEW
#            badge (auto-ages out after 30 days, client-side) and the changelog.
# last_verified: ISO date (YYYY-MM-DD) the pricing / free-tier claim was last
#            checked on the provider's own page. Distinct from `added` — bump it
#            on every re-check, even if nothing changed. Must be >= added.
#            Quote all dates ("2026-06-15"). `python scripts/stale.py` lists
#            tools not verified in the last 90 days (quarterly refresh).
# Pricing strings are point-in-time (see pricing_as_of). Verify on the provider
# page before quoting to the cohort.
# =============================================================================

meta:
  title: KIRIN AI Tools Repository
  audience: Foster Hybrid MBA students new to AI
  # Catalog-wide pricing date. Superseded by per-tool `last_verified`; remove
  # this field once every tool has an independently verified last_verified date
  # (i.e. after the first full refresh, when no last_verified merely equals added).
  pricing_as_of: "2026-05"
  maintainers:
    - Tyler Futch (Technical & Governance Lead)
    - Nick Trezza (AI Chair)
  handoff_to: Cohort 10 (Sept 2026 onboarding)

categories:
  - id: general
    title: "💬 General-Purpose Assistants"
    order: 1
    blurb: >-
      Start here. These are the Swiss-army tools that handle writing, analysis,
      brainstorming, summarizing, and light coding in one chat box. Pick ONE as
      your daily driver before reaching for anything specialized.
  - id: research
    title: "🔎 Research & Literature"
    order: 2
    blurb: >-
      Cited answers, paper discovery, and synthesis of sources. Use these when
      "I need evidence" matters more than "I need a draft."
  - id: writing
    title: "✍️ Writing & Editing"
    order: 3
    blurb: >-
      Polish, paraphrase, and clarity. These refine what you've written rather
      than replace your thinking.
  - id: data
    title: "📊 Data Analysis & Visualization"
    order: 4
    blurb: >-
      Turn spreadsheets and datasets into analysis and dashboards — from
      chat-based analysts to enterprise BI.
  - id: design
    title: "🖼️ Image, Design & Brand"
    order: 5
    blurb: >-
      Generate visuals, graphics, and brand assets. Watch licensing for
      anything you publish.
  - id: slides
    title: "🎤 Presentations & Slides"
    order: 6
    blurb: >-
      Get a first-draft deck in minutes. Always rework AI slides before
      presenting — they read as generic out of the box.
  - id: audio
    title: "🎧 Audio & Voice"
    order: 7
    blurb: >-
      Turn text into audio and audio into text. Listen to readings on your
      commute, or generate clean voiceovers for presentations.
  - id: meetings
    title: "🎙️ Meetings & Note-Taking"
    order: 8
    blurb: >-
      Transcribe lectures and team calls, capture action items, and organize
      notes. Get consent before recording others.
  - id: automation
    title: "⚙️ Productivity & Workflow Automation"
    order: 9
    blurb: >-
      Connect your apps and kill repetitive busywork.
  - id: coding
    title: "💻 Coding & Technical"
    order: 10
    blurb: >-
      For the analytics, data, and tech-track electives — or anyone learning to
      build.
  - id: career
    title: "💼 Career & Recruiting"
    order: 11
    blurb: >-
      Résumés, networking, interview prep, and application tracking.
  - id: governance
    title: "🛡️ Governance, Responsible Use & Compliance"
    order: 12
    blurb: >-
      The part most tool lists skip. Read the Ground Rules on the site before
      using anything above in graded work.

tools:
  # --- General-Purpose Assistants ---
  - name: ChatGPT
    url: https://chatgpt.com
    category: general
    what: Conversational assistant for writing, analysis, brainstorming, and light coding; built-in data analysis, image generation, and web browsing.
    best_for: A reliable all-rounder and most people's first tool.
    pricing: "Free; Go $8/mo (Free and Go may include ads in the US); Plus $20/mo; Pro from $100/mo (3 usage tiers) — Plus and Pro are ad-free"
    cost_tier: Freemium
    difficulty: Beginner
    contexts: [education, professional, personal]
    added: "2026-04-20"
    last_verified: "2026-09-30"
    notes: Free tier is enough for most coursework. Verify before pasting anything confidential.

  - name: Claude
    url: https://claude.ai
    category: general
    what: Conversational assistant especially strong at long-document analysis, careful reasoning, and natural writing.
    best_for: Nuanced writing, reading large PDFs/case packs, and work where tone matters.
    pricing: "Free; Pro $20/mo ($17/mo billed annually); Max $100–200/mo"
    cost_tier: Freemium
    difficulty: Beginner
    contexts: [education, professional, personal]
    added: "2026-04-20"
    last_verified: "2026-09-30"
    notes: Large context window handles full case packs in one go.

  - name: Google Gemini
    url: https://gemini.google.com
    category: general
    what: Google's assistant with a very large context window, deeply integrated into Gmail, Docs, Drive, and Sheets; also generates images.
    best_for: Students who live in Google Workspace; fits an entire semester of notes in context.
    pricing: "Free; AI Plus ~$7.99/mo, AI Pro $19.99/mo — verified US college students get 12 months of AI Pro free, redeem by 2026-12-31"
    cost_tier: Free for students
    difficulty: Beginner
    contexts: [education, professional, personal]
    added: "2026-04-20"
    last_verified: "2026-09-30"
    notes: "Free student year of AI Pro: verify student status through SheerID and redeem by 2026-12-31. Auto-renews at full price afterward."

  - name: Microsoft Copilot
    url: https://copilot.microsoft.com
    category: general
    what: Microsoft's assistant, embedded across Word, Excel, Outlook, PowerPoint, and Teams.
    best_for: Office-heavy workflows where you want AI inside the apps you already use.
